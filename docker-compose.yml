services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: majid_backend
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000
    volumes:
      # Persistent volume for local uploaded files (if any)
      - uploads_data:/app/uploads

volumes:
  uploads_data:
